name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        type: choice
        options:
          - bikky
          - "@bikky-dev/ui"
          - both
        default: both
      dry_run:
        description: "Dry run (skip actual publish)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-test-core:
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == 'bikky' || inputs.package == 'both'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - run: npm run build

      - run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: dist-core
          path: dist/
          retention-days: 1

  build-test-ui:
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == '@bikky-dev/ui' || inputs.package == 'both'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install & build @bikky-dev/ui
        working-directory: packages/ui
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist-ui
          path: packages/ui/dist/
          retention-days: 1

  publish-core:
    needs: build-test-core
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: dist-core
          path: dist/

      - run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-ui:
    needs: build-test-ui
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: dist-ui
          path: packages/ui/dist/

      - name: Publish @bikky-dev/ui
        working-directory: packages/ui
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
