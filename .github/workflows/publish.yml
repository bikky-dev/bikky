name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        type: choice
        options:
          - bikky
          - "bikky-ui"
          - both
        default: both
      dry_run:
        description: "Dry run (skip actual publish)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  build-test-core:
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == 'bikky' || inputs.package == 'both'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci

      - run: npm run build

      - run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: dist-core
          path: dist/
          retention-days: 1

  build-test-ui:
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == 'bikky-ui' || inputs.package == 'both'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install & build bikky-ui
        working-directory: packages/ui
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist-ui
          path: packages/ui/dist/
          retention-days: 1

  publish-core:
    needs: build-test-core
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use npm with OIDC support
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      - uses: actions/download-artifact@v8
        with:
          name: dist-core
          path: dist/

      - name: Check version not already published
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "bikky@${PKG_VERSION}" version 2>/dev/null; then
            echo "::error::bikky@${PKG_VERSION} already exists on npm — bump the version first"
            exit 1
          fi
          echo "Publishing bikky@${PKG_VERSION}"

      - run: npm publish --access public --ignore-scripts

  publish-ui:
    needs: build-test-ui
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use npm with OIDC support
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      - uses: actions/download-artifact@v8
        with:
          name: dist-ui
          path: packages/ui/dist/

      - name: Check version not already published
        working-directory: packages/ui
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "bikky-ui@${PKG_VERSION}" version 2>/dev/null; then
            echo "::error::bikky-ui@${PKG_VERSION} already exists on npm — bump the version first"
            exit 1
          fi
          echo "Publishing bikky-ui@${PKG_VERSION}"

      - name: Publish bikky-ui
        working-directory: packages/ui
        run: npm publish --access public --ignore-scripts
