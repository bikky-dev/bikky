name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: CodeQL disabled
        if: ${{ vars.BIKKY_CODEQL_ENABLED != 'true' }}
        run: echo "CodeQL upload requires GitHub code scanning/Advanced Security. Set repository variable BIKKY_CODEQL_ENABLED=true after enabling code scanning."

      - uses: actions/checkout@v6
        if: ${{ vars.BIKKY_CODEQL_ENABLED == 'true' }}

      - name: Initialize CodeQL
        if: ${{ vars.BIKKY_CODEQL_ENABLED == 'true' }}
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config: |
            paths-ignore:
              - dist
              - packages/ui/dist
              - packages/ui/app/dist
              - node_modules
              - "**/*.test.ts"
              - "**/*.test.tsx"

      - name: Autobuild
        if: ${{ vars.BIKKY_CODEQL_ENABLED == 'true' }}
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        if: ${{ vars.BIKKY_CODEQL_ENABLED == 'true' }}
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
