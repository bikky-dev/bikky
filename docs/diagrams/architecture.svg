<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380" fill="none">
  <style>
    .bg { fill: #fafbfc; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 10; }
    .box-agent { fill: #eff6ff; stroke: #93c5fd; }
    .box-mcp { fill: #f0fdf4; stroke: #86efac; }
    .box-daemon { fill: #fefce8; stroke: #fde68a; }
    .box-db { fill: #faf5ff; stroke: #c4b5fd; }
    .box-logs { fill: #f8fafc; stroke: #cbd5e1; }
    .title { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1e293b; }
    .subtitle { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #64748b; }
    .label { font: 500 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #475569; }
    .arrow { stroke: #94a3b8; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .arrow-bi { stroke: #94a3b8; stroke-width: 1.5; fill: none; marker-start: url(#arrowhead-start); marker-end: url(#arrowhead); }
    .icon { font: 400 18px -apple-system, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .box-agent { fill: #0d1b2a; stroke: #1f6feb; }
      .box-mcp { fill: #0d1f12; stroke: #238636; }
      .box-daemon { fill: #1c1a0d; stroke: #9e6a03; }
      .box-db { fill: #170d22; stroke: #8957e5; }
      .box-logs { fill: #111318; stroke: #30363d; }
      .title { fill: #e6edf3; }
      .subtitle { fill: #8b949e; }
      .label { fill: #8b949e; }
      .arrow, .arrow-bi { stroke: #484f58; }
    }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowhead-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="620" height="380" rx="0"/>

  <!-- Agent box (top-left) -->
  <rect class="box box-agent" x="30" y="30" width="200" height="64"/>
  <text class="icon" x="50" y="70">🤖</text>
  <text class="title" x="72" y="56">Copilot / Claude Code</text>
  <text class="subtitle" x="72" y="72">AI coding agent</text>

  <!-- Session logs box (top-right) -->
  <rect class="box box-logs" x="390" y="30" width="200" height="64"/>
  <text class="icon" x="410" y="70">📁</text>
  <text class="title" x="432" y="56">Session Logs</text>
  <text class="subtitle" x="432" y="72">~/.copilot/</text>

  <!-- MCP Server box (mid-left) -->
  <rect class="box box-mcp" x="30" y="160" width="200" height="64"/>
  <text class="icon" x="50" y="200">⚡</text>
  <text class="title" x="72" y="186">bikky MCP Server</text>
  <text class="subtitle" x="72" y="202">12 memory tools</text>

  <!-- Daemon box (mid-right) -->
  <rect class="box box-daemon" x="390" y="160" width="200" height="64"/>
  <text class="icon" x="410" y="200">👁</text>
  <text class="title" x="432" y="186">bikky Daemon</text>
  <text class="subtitle" x="432" y="202">background watcher</text>

  <!-- Qdrant box (bottom-center) -->
  <rect class="box box-db" x="195" y="296" width="230" height="64"/>
  <text class="icon" x="215" y="336">🔮</text>
  <text class="title" x="240" y="322">Qdrant Cloud</text>
  <text class="subtitle" x="240" y="338">shared vector store</text>

  <!-- Arrow: Agent ↔ MCP Server -->
  <line class="arrow-bi" x1="130" y1="94" x2="130" y2="160"/>
  <text class="label" x="140" y="132">MCP stdio</text>

  <!-- Arrow: Logs → Daemon -->
  <line class="arrow" x1="490" y1="94" x2="490" y2="160"/>
  <text class="label" x="500" y="132">events.jsonl</text>

  <!-- Arrow: MCP Server → Qdrant -->
  <path class="arrow" d="M130,224 L130,310 Q130,328 148,328 L195,328"/>
  <text class="label" x="80" y="270">store / recall</text>

  <!-- Arrow: Daemon → Qdrant -->
  <path class="arrow" d="M490,224 L490,310 Q490,328 472,328 L425,328"/>
  <text class="label" x="496" y="270">embed + store</text>
</svg>
