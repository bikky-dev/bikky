  <text x="191" y="403" text-anchor="middle" font-size="10" fill="#059669" font-weight="500">Deduplication</text>

  <rect x="267" y="386" width="100" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="317" y="403" text-anchor="middle" font-size="10" fill="#059669" font-weight="500">Distillation</text>

  <rect x="383" y="386" width="120" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="443" y="403" text-anchor="middle" font-size="10" fill="#059669" font-weight="500">Staleness Decay</text>

  <rect x="519" y="386" width="170" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="604" y="403" text-anchor="middle" font-size="10" fill="#059669" font-weight="500">Contradiction Resolve</text>

