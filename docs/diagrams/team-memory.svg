<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" fill="none">
  <style>
    .bg { fill: #131620; }
    .card { fill: #1c2030; stroke: #2a2f44; stroke-width: 1; }
    .store-bg { fill: #6c3fe4; }
    .store-glow { fill: #6c3fe4; opacity: 0.10; }
    .title { fill: #e8eaf0; font: 700 14px/1 'Inter', 'SF Pro Display', system-ui, sans-serif; }
    .subtitle { fill: #8690a8; font: 400 10.5px/1 'Inter', 'SF Pro Display', system-ui, sans-serif; }
    .label { fill: #e8eaf0; font: 600 12px/1 'Inter', 'SF Pro Display', system-ui, sans-serif; }
    .fact-text { fill: #b0b8cc; font: 400 9.5px/1 'Inter', 'SF Pro Display', system-ui, sans-serif; }
    .store-text { fill: #ffffff; font: 700 15px/1 'Inter', 'SF Pro Display', system-ui, sans-serif; }
    .store-sub { fill: rgba(255,255,255,0.65); font: 400 10px/1 'Inter', 'SF Pro Display', system-ui, sans-serif; }
    .badge { font: 600 8px/1 'Inter', 'SF Pro Display', system-ui, sans-serif; fill: white; }
    .badge-bg-dedup { fill: #3b82f6; }
    .badge-bg-distill { fill: #8b5cf6; }
    .badge-bg-decay { fill: #f59e0b; }
    .badge-bg-entity { fill: #10b981; }
    .arrow { stroke: #7c5ce8; stroke-width: 1.5; fill: none; opacity: 0.5; }
    .arrow-head { fill: #7c5ce8; opacity: 0.5; }
    .return-arrow { stroke: #34d399; stroke-width: 1.5; fill: none; opacity: 0.45; stroke-dasharray: 6 4; }
    .return-head { fill: #34d399; opacity: 0.45; }
    .person-bg-1 { fill: #3b2e6e; }
    .person-icon-1 { fill: #a78bfa; }
    .person-bg-2 { fill: #1e3a5f; }
    .person-icon-2 { fill: #60a5fa; }
    .person-bg-3 { fill: #1a4731; }
    .person-icon-3 { fill: #6ee7b7; }
    .fact-card { fill: #232840; stroke: #2e3450; stroke-width: 0.5; }
    .session-label { fill: #6b7490; font: 500 8px/1 'Inter', 'SF Pro Display', system-ui, sans-serif; letter-spacing: 0.8px; }
    .future-card { fill: #0f2a1e; stroke: #1a4731; stroke-width: 1; }
    .future-label { fill: #6ee7b7; font: 600 12px/1 'Inter', 'SF Pro Display', system-ui, sans-serif; }
    .future-sub { fill: #8690a8; font: 400 10px/1 'Inter', 'SF Pro Display', system-ui, sans-serif; }
    .future-fact { fill: #132f21; stroke: #1a4731; stroke-width: 0.5; }
    .future-text { fill: #6ee7b7; font: 400 9.5px/1 'Inter', 'SF Pro Display', system-ui, sans-serif; }
    .bottom-text { fill: #6b7490; font: italic 400 11px/1 'Inter', 'SF Pro Display', system-ui, sans-serif; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #f8f9fc; }
      .card { fill: #ffffff; stroke: #e2e4ea; }
      .store-glow { fill: #6c3fe4; opacity: 0.06; }
      .title { fill: #1a1a2e; }
      .subtitle { fill: #6b7085; }
      .label { fill: #1a1a2e; }
      .fact-text { fill: #4a4d5e; }
      .arrow { stroke: #6c3fe4; opacity: 0.4; }
      .arrow-head { fill: #6c3fe4; opacity: 0.4; }
      .return-arrow { stroke: #10b981; opacity: 0.4; }
      .return-head { fill: #10b981; opacity: 0.4; }
      .person-bg-1 { fill: #ede9fe; }
      .person-icon-1 { fill: #7c3aed; }
      .person-bg-2 { fill: #dbeafe; }
      .person-icon-2 { fill: #2563eb; }
      .person-bg-3 { fill: #d1fae5; }
      .person-icon-3 { fill: #059669; }
      .fact-card { fill: #f3f4f8; stroke: #e2e4ea; }
      .session-label { fill: #9ca0b0; }
      .future-card { fill: #ecfdf5; stroke: #a7f3d0; }
      .future-label { fill: #065f46; }
      .future-sub { fill: #6b7085; }
      .future-fact { fill: #d1fae5; stroke: #a7f3d0; }
      .future-text { fill: #065f46; }
      .bottom-text { fill: #6b7085; }
    }
  </style>

  <rect class="bg" width="1200" height="500" rx="10" />

  <!-- ===== LEFT COLUMN: THREE ENGINEERS ===== -->

  <!-- Alice — Session 12 -->
  <g transform="translate(60, 30)">
    <rect class="card" x="0" y="0" width="240" height="120" rx="10" />
    <circle class="person-bg-1" cx="34" cy="36" r="20" />
    <circle class="person-icon-1" cx="34" cy="32" r="7" />
    <path class="person-icon-1" d="M21,48 a13,10 0 0,1 26,0" />
    <text class="label" x="66" y="32">Alice</text>
    <text class="session-label" x="66" y="46">SESSION 12</text>
    <rect class="fact-card" x="12" y="64" width="216" height="22" rx="4" />
    <text class="fact-text" x="22" y="79">Deploy order: staging → canary → prod</text>
    <rect class="fact-card" x="12" y="92" width="216" height="22" rx="4" />
    <text class="fact-text" x="22" y="107">Redis cache TTL is 300s for sessions</text>
  </g>

  <!-- Ben — Session 8 -->
  <g transform="translate(60, 180)">
    <rect class="card" x="0" y="0" width="240" height="120" rx="10" />
    <circle class="person-bg-2" cx="34" cy="36" r="20" />
    <circle class="person-icon-2" cx="34" cy="32" r="7" />
    <path class="person-icon-2" d="M21,48 a13,10 0 0,1 26,0" />
    <text class="label" x="66" y="32">Ben</text>
    <text class="session-label" x="66" y="46">SESSION 8</text>
    <rect class="fact-card" x="12" y="64" width="216" height="22" rx="4" />
    <text class="fact-text" x="22" y="79">Chose Drizzle ORM over Prisma</text>
    <rect class="fact-card" x="12" y="92" width="216" height="22" rx="4" />
    <text class="fact-text" x="22" y="107">Auth service uses Ed25519 JWTs</text>
  </g>

  <!-- Carla — Session 15 -->
  <g transform="translate(60, 330)">
    <rect class="card" x="0" y="0" width="240" height="120" rx="10" />
    <circle class="person-bg-3" cx="34" cy="36" r="20" />
    <circle class="person-icon-3" cx="34" cy="32" r="7" />
    <path class="person-icon-3" d="M21,48 a13,10 0 0,1 26,0" />
    <text class="label" x="66" y="32">Carla</text>
    <text class="session-label" x="66" y="46">SESSION 15</text>
    <rect class="fact-card" x="12" y="64" width="216" height="22" rx="4" />
    <text class="fact-text" x="22" y="79">Composite index on (tenant_id, ts)</text>
    <rect class="fact-card" x="12" y="92" width="216" height="22" rx="4" />
    <text class="fact-text" x="22" y="107">Billing team owns Stripe webhooks</text>
  </g>

  <!-- ===== ARROWS: LEFT → CENTER ===== -->
  <!-- Alice → Store -->
  <path class="arrow" d="M300,90 C380,90 420,200 500,220" />
  <polygon class="arrow-head" points="496,216 504,224 500,214" />

  <!-- Ben → Store -->
  <line class="arrow" x1="300" y1="240" x2="500" y2="240" />
  <polygon class="arrow-head" points="496,236 504,244 496,244" />

  <!-- Carla → Store -->
  <path class="arrow" d="M300,390 C380,390 420,280 500,260" />
  <polygon class="arrow-head" points="496,264 504,256 500,266" />

  <!-- ===== CENTRAL STORE ===== -->
  <ellipse class="store-glow" cx="620" cy="240" rx="160" ry="80" />
  <rect class="store-bg" x="510" y="195" width="220" height="90" rx="14" />

  <text class="store-text" text-anchor="middle" x="620" y="228">Shared Knowledge Store</text>
  <text class="store-sub" text-anchor="middle" x="620" y="248">Qdrant · semantic search · entity graph</text>

  <!-- Curation badges -->
  <rect class="badge-bg-dedup" x="524" y="270" width="52" height="16" rx="8" />
  <text class="badge" text-anchor="middle" x="550" y="281">dedup</text>

  <rect class="badge-bg-distill" x="584" y="270" width="52" height="16" rx="8" />
  <text class="badge" text-anchor="middle" x="610" y="281">distill</text>

  <rect class="badge-bg-decay" x="644" y="270" width="52" height="16" rx="8" />
  <text class="badge" text-anchor="middle" x="670" y="281">decay</text>

  <rect class="badge-bg-entity" x="704" y="270" width="52" height="16" rx="8" />
  <text class="badge" text-anchor="middle" x="730" y="281">entity</text>

  <!-- ===== RETURN ARROW: STORE → FUTURE SESSION ===== -->
  <path class="return-arrow" d="M730,235 C800,230 860,220 910,200" />
  <polygon class="return-head" points="906,204 916,196 908,194" />

  <!-- ===== RIGHT: EVERY FUTURE SESSION ===== -->
  <g transform="translate(920, 100)">
    <rect class="future-card" x="0" y="0" width="230" height="160" rx="10" />
    <text class="future-label" x="20" y="28">Every Future Session</text>
    <text class="future-sub" x="20" y="46">starts with full context</text>
    <rect class="future-fact" x="14" y="62" width="202" height="24" rx="4" />
    <text class="future-text" x="24" y="78">✓ Deploy order recalled</text>
    <rect class="future-fact" x="14" y="92" width="202" height="24" rx="4" />
    <text class="future-text" x="24" y="108">✓ All team decisions loaded</text>
    <rect class="future-fact" x="14" y="122" width="202" height="24" rx="4" />
    <text class="future-text" x="24" y="138">✓ Entity graph available</text>
  </g>

  <!-- ===== BOTTOM TAGLINE ===== -->
  <text class="bottom-text" text-anchor="middle" x="600" y="480">Session 1 learns it · Session 50 already knows it</text>
</svg>
