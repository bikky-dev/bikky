  <line x1="376" y1="184" x2="196" y2="104" stroke="#818cf8" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#b)"/>
  <line x1="446" y1="184" x2="446" y2="104" stroke="#818cf8" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#b)"/>
  <line x1="504" y1="184" x2="684" y2="104" stroke="#818cf8" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#b)"/>

