  <line x1="174" y1="104" x2="364" y2="178" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="434" y1="104" x2="434" y2="178" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="706" y1="104" x2="516" y2="178" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>

